<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%">
  <defs>
    <style>
      .divider { stroke: #30363d; stroke-width: 2; }
      .base { fill: #2C2C2C; }
      .arm { fill: #FF6600; stroke: #CC5200; stroke-width: 2; }
      .joint { fill: #4A4A4A; stroke: #2C2C2C; stroke-width: 1.5; }
      .gripper { fill: #FF6600; stroke: #CC5200; stroke-width: 2; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Línea divisoria superior -->
  <line class="divider" x1="0" y1="20" x2="1200" y2="20" />

  <!-- Texto del footer -->
  <text x="600" y="130" text-anchor="middle" class="text">
    Hecho con ☕ y curiosidad · Plan B · 2026
  </text>

  <!-- Brazo robótico animado -->
  <g id="robot-arm">
    <!-- Animación de movimiento horizontal (izquierda a derecha y vuelta) -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="100,0; 1100,0; 100,0"
      dur="12s"
      repeatCount="indefinite"
    />

    <!-- Base del robot -->
    <rect class="base" x="-30" y="40" width="60" height="20" rx="3" />
    <circle class="base" cx="0" cy="50" r="25" />

    <!-- Articulación principal (hombro) -->
    <circle class="joint" cx="0" cy="50" r="12" />

    <!-- Brazo principal -->
    <g>
      <!-- Animación de rotación (saludo al llegar a las esquinas) -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 0 50; 0 0 50; -25 0 50; 0 0 50; 0 0 50; 25 0 50; 0 0 50; 0 0 50"
        keyTimes="0; 0.45; 0.5; 0.55; 0.95; 1; 0; 0"
        dur="12s"
        repeatCount="indefinite"
      />
      
      <rect class="arm" x="-8" y="50" width="16" height="60" rx="4" />
      
      <!-- Articulación del codo -->
      <circle class="joint" cx="0" cy="110" r="10" />

      <!-- Antebrazo -->
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 110; 0 0 110; 15 0 110; 0 0 110; 0 0 110; -15 0 110; 0 0 110; 0 0 110"
          keyTimes="0; 0.45; 0.5; 0.55; 0.95; 1; 0; 0"
          dur="12s"
          repeatCount="indefinite"
        />
        
        <rect class="arm" x="-6" y="110" width="12" height="45" rx="3" />
        
        <!-- Muñeca -->
        <circle class="joint" cx="0" cy="155" r="8" />

        <!-- Gripper / herramienta -->
        <g>
          <rect class="gripper" x="-10" y="155" width="20" height="8" rx="2" />
          <rect class="gripper" x="-12" y="163" width="8" height="12" rx="1" />
          <rect class="gripper" x="4" y="163" width="8" height="12" rx="1" />
        </g>
      </g>
    </g>
  </g>
</svg>