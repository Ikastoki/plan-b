<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
  <defs>
    <style>
      /* Colores base para los modos */
      .bg-light { fill: #ffffff; }
      .bg-dark { fill: #0d1117; }
      .text-main-light { fill: #1f2328; }
      .text-main-dark { fill: #f0f6fc; }
      .text-sub-light { fill: #656d76; }
      .text-sub-dark { fill: #8b949e; }
      .accent-light { stroke: #0969da; }
      .accent-dark { stroke: #58a6ff; }
      .grid-light { stroke: #d0d7de; }
      .grid-dark { stroke: #21262d; }

      /* Detección automática del tema del sistema / GitHub */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .text-main { fill: #f0f6fc; }
        .text-sub { fill: #8b949e; }
        .accent { stroke: #58a6ff; }
        .grid { stroke: #21262d; }
        .accent-fill { fill: #58a6ff; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-main { fill: #1f2328; }
        .text-sub { fill: #656d76; }
        .accent { stroke: #0969da; }
        .grid { stroke: #d0d7de; }
        .accent-fill { fill: #0969da; }
      }
      
      /* Tipografías */
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 80px; font-weight: 800; letter-spacing: -3px; }
      .subtitle { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 26px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect class="bg" width="1200" height="350" />

  <!-- Rejilla de fondo sutil (estilo plano técnico) -->
  <g class="grid" stroke-width="1" opacity="0.5">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300" />
    <path d="M200 0 L200 350 M400 0 L400 350 M600 0 L600 350 M800 0 L800 350 M1000 0 L1000 350" />
  </g>

  <!-- Gráfico abstracto industrial / circuito (Lado derecho) -->
  <g class="accent" stroke-width="3" fill="none" opacity="0.7">
    <!-- Hexágono principal -->
    <polygon points="950,175 1020,135 1020,55 950,15 880,55 880,135" />
    <!-- Hexágono interior -->
    <polygon points="950,175 990,152 990,102 950,80 910,102 910,152" stroke-width="2" />
    <!-- Nodos de conexión -->
    <circle cx="950" cy="15" r="6" class="accent-fill" stroke="none" />
    <circle cx="1020" cy="55" r="6" class="accent-fill" stroke="none" />
    <circle cx="1020" cy="135" r="6" class="accent-fill" stroke="none" />
    <circle cx="950" cy="175" r="6" class="accent-fill" stroke="none" />
    <circle cx="880" cy="135" r="6" class="accent-fill" stroke="none" />
    <circle cx="880" cy="55" r="6" class="accent-fill" stroke="none" />
    
    <!-- Líneas de extensión -->
    <line x1="880" y1="95" x2="750" y2="95" stroke-dasharray="6,6" />
    <line x1="1020" y1="95" x2="1150" y2="95" stroke-dasharray="6,6" />
    <line x1="950" y1="175" x2="950" y2="280" stroke-dasharray="6,6" />
  </g>

  <!-- Texto -->
  <text x="80" y="160" class="title text-main">Plan B</text>
  <text x="84" y="220" class="subtitle text-sub">Automatización &amp; Robótica</text>
  
  <!-- Línea decorativa bajo el subtítulo -->
  <line x1="80" y1="260" x2="220" y2="260" class="accent" stroke-width="5" stroke-linecap="round" />
</svg>